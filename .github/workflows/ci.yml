name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os != 'Windows'
        run: cargo test --locked -q
      # Windows: the board crate and the verbs the pi extension calls. The
      # full agent suite drives git worktrees and unix paths (open item).
      - if: runner.os == 'Windows'
        run: cargo test --locked -q -p board && cargo test --locked -q -p agent --test board_extension --test cli_dispatch && cargo build --locked -q -p agent

  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
