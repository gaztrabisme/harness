name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p agent --target ${{ matrix.target }}

      - name: Stage binary and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe=".exe"
          fi
          cp "target/$TARGET/release/agent$exe" "dist/agent-$TARGET$exe"
          (
            cd dist
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "agent-$TARGET$exe" > "agent-$TARGET.sha256"
            else
              sha256sum "agent-$TARGET$exe" > "agent-$TARGET.sha256"
            fi
          )

      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums into SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat agent-*.sha256 > SHA256SUMS
          rm -f agent-*.sha256
          cat SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent-*
            dist/SHA256SUMS
